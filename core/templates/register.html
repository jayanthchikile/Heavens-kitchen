{% extends 'base.html' %}

{% block content %}

<style>

/* PAGE BACKGROUND (SAFE - NO OVERRIDE ISSUE) */
.page-bg {
    min-height: 100vh;
    background: #fff8f3;
    position: relative;
    overflow: hidden;
}

/* FLOATING FOOD ICONS */
.bg-icons {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.bg-icons span {
    position: absolute;
    font-size: 22px;
    opacity: 0.08;
    animation: float 10s ease-in-out infinite;
}

/* POSITIONS */
.bg-icons span:nth-child(1) { top: 10%; left: 20%; }
.bg-icons span:nth-child(2) { top: 30%; left: 70%; }
.bg-icons span:nth-child(3) { top: 70%; left: 10%; }
.bg-icons span:nth-child(4) { top: 80%; left: 80%; }
.bg-icons span:nth-child(5) { top: 50%; left: 50%; }

/* FLOAT ANIMATION */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

/* CONTAINER */
.register-container {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90vh;
}

/* CARD */
.register-box {
    background: white;
    padding: 40px;
    border-radius: 20px;
    width: 360px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    text-align: center;
    animation: fadeIn 0.8s ease;
}

/* ENTRY ANIMATION */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TITLE */
.register-box h2 {
    color: #ff5722;
    margin-bottom: 20px;
}

/* INPUT GROUP */
.input-group {
    position: relative;
    margin: 15px 0;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    outline: none;
}

/* INPUT FOCUS */
.input-group input:focus {
    border-color: #ff5722;
    box-shadow: 0 0 6px rgba(255,87,34,0.3);
}

/* LABEL */
.input-group label {
    position: absolute;
    left: 12px;
    top: 12px;
    font-size: 13px;
    color: #999;
    transition: 0.3s;
}

/* FLOAT LABEL */
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
    top: -8px;
    left: 8px;
    font-size: 11px;
    color: #ff5722;
}

/* BUTTON */
.register-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 25px;
    border: none;
    font-size: 15px;
    background: #ff5722;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

/* BUTTON HOVER */
.register-box button:hover {
    background: #e64a19;
    transform: translateY(-2px);
}

/* TERMS */
.terms {
    font-size: 12px;
    margin-top: 10px;
    text-align: left;
}

/* LOGIN LINK */
.login-link {
    margin-top: 15px;
    font-size: 13px;
}

.login-link a {
    color: #ff5722;
    font-weight: bold;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}

</style>

<div class="page-bg">

    <!-- FLOATING ICONS -->
    <div class="bg-icons">
        <span>🍕</span>
        <span>🍔</span>
        <span>🍟</span>
        <span>🍩</span>
        <span>🍜</span>
    </div>

    <div class="register-container">
        <div class="register-box">
            <h2>Create Account 📝</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    <input type="text" name="fullname" placeholder=" " required>
                    <label>Full Name</label>
                </div>

                <div class="input-group">
                    <input type="text" name="username" placeholder=" " required>
                    <label>Username</label>
                </div>

                <div class="input-group">
                    <input type="email" name="email" placeholder=" " required>
                    <label>Email</label>
                </div>

                <div class="input-group">
                    <input type="text" name="phone" placeholder=" " required>
                    <label>Phone Number</label>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder=" " required>
                    <label>Password</label>
                </div>

                <div class="input-group">
                    <input type="password" name="confirm_password" placeholder=" " required>
                    <label>Confirm Password</label>
                </div>

                <div class="terms">
                    <input type="checkbox" required> I agree to Terms & Conditions
                </div>

                <button type="submit">🚀 Register</button>
            </form>

            <div class="login-link">
                Already have an account? 
                <a href="{% url 'login' %}">Login</a>
            </div>
        </div>
    </div>

</div>

{% endblock %}
