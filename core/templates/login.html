{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background: linear-gradient(to right, #ff7e5f, #feb47b);
    }

    .login-container {
        display: flex;
        height: 90vh;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        background: white;
        padding: 35px;
        border-radius: 15px;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
        color: black;
    }

    .tagline {
        font-size: 14px;
        color: gray;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
    }

    input:focus {
        border-color: #ff5722;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #ff5722;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #e64a19;
    }

    .footer {
        margin-top: 15px;
        font-size: 13px;
    }

    .footer a {
        color: #ff5722;
        text-decoration: none;
        font-weight: bold;
    }
</style>

<div class="login-container">
    <div class="login-box">

        <div class="logo">🍽️ Heavens Kitchen</div>
        <div class="tagline">Delicious food, delivered with love</div>

        <h3>Login to your account 🔐</h3>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Don’t have an account? 
            <a href="{% url 'register' %}">Register</a>
        </div>

    </div>
</div>

{% endblock %}
