{% extends 'base.html' %}

{% block content %}

<style>

/* BACKGROUND GRADIENT ANIMATION */
body {
    background: linear-gradient(-45deg, #ff5722, #ff9800, #ff7043, #ffcc80);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    margin: 0;
}

/* ANIMATION */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* CONTAINER */
.booking-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 85vh;
}

/* GLASS EFFECT BOX */
.booking-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    width: 360px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    text-align: center;
    color: white;
    animation: fadeIn 1s ease;
}

/* ENTRY ANIMATION */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TITLE */
.title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 20px;
}

/* FLOATING INPUT GROUP */
.input-group {
    position: relative;
    margin: 15px 0;
}

/* INPUT */
.input-group input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 14px;
}

/* PLACEHOLDER HIDE */
.input-group input::placeholder {
    color: transparent;
}

/* LABEL */
.input-group label {
    position: absolute;
    left: 12px;
    top: 12px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    transition: 0.3s;
}

/* FLOAT EFFECT */
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
    top: -8px;
    left: 8px;
    font-size: 11px;
    color: #fff;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg, #ff5722, #ff9800);
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

/* BUTTON HOVER */
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
}

/* SUCCESS MESSAGE */
.success-box {
    background: rgba(0,255,0,0.2);
    border: 1px solid rgba(0,255,0,0.4);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 13px;
}

</style>

<div class="booking-container">
    <div class="booking-box">

        <div class="title">🍽️ Heavens Kitchen</div>
        <div class="subtitle">Reserve your table easily</div>

        <h3>Book a Table</h3>

        {% if success %}
        <div class="success-box">
            🎉 Booked for <b>{{ name }}</b><br>
            📅 {{ date }} ⏰ {{ time }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" name="name" value="{{ booking.name|default:'' }}" placeholder="Name">
                <label>Your Name</label>
            </div>

            <div class="input-group">
                <input type="date" name="date" value="{{ booking.date|default:'' }}" placeholder="Date">
                <label>Select Date</label>
            </div>

            <div class="input-group">
                <input type="time" name="time" value="{{ booking.time|default:'' }}" placeholder="Time">
                <label>Select Time</label>
            </div>

            <button type="submit">✨ Book Now</button>
        </form>

    </div>
</div>

{% endblock %}
